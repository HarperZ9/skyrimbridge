<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 564" width="960" height="564" font-family="Hanken Grotesk, Segoe UI, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Eight stages carrying live game state into a shader parameter: frame tick, trackers, one struct, dirty compare, name table, ENB push, shader header, shader read. Per-domain trackers collect twenty-four domains of state, covering celestial position, atmosphere, fog, weather, the player, the camera, interiors, shadow, effects, render state, image space, nearby lights, actor values, the crosshair, equipment, quests, UI state, computed feedback, region and location, audio and music, NPC detection, performance and GPU timing, scene composition, and theme. Everything lands in one flat struct of 133 float4 slots. Each slot is compared against the previous frame sixteen bytes at a time, and an unchanged slot is skipped rather than resent. A surviving slot is looked up in a table that pairs a published name with a byte offset into the struct, then written through ENBSetParameter once for each of the nine ENB stage shaders: sun sprite, effect prepass, effect, effect postpass, lens, underwater, depth of field, bloom and adaptation. The shader header declares the same 133 names as annotated float4 values, all hidden from the ENB editor, and a shader reads one by name. Three outcomes: a slot published to every target shader, a slot skipped because its bytes did not change, and no write at all when ENBSetParameter was never resolved."><style>
  :root{ --void:#f4f3ef; --bone:#0b0c0e; --muted:#43474e;
    --hairline:rgba(11,12,14,.16); --card:rgba(255,255,255,.66);
    --verified:#1f7a52; --drift:#3a2bd6; }
  @media (prefers-color-scheme: dark){
    :root{ --void:#0b0e0f; --bone:#eef1ee; --muted:#9aa39c;
      --hairline:rgba(238,241,238,.18); --card:rgba(255,255,255,.05);
      --verified:#5fae93; --drift:#a99cf5; } }
  .bg{ fill:var(--void); }
  .card{ fill:var(--card); stroke:var(--hairline); stroke-width:1.4; }
  .n{ fill:var(--bone); font-size:15px; font-weight:650; }
  .s{ fill:var(--muted); font-size:11.5px; }
  .k{ fill:var(--muted); font-size:11px; letter-spacing:.16em; }
  .h{ fill:var(--bone); font-size:21px; font-weight:700; }
  .fwd{ stroke:var(--verified); stroke-width:2; fill:none; }
  .back{ stroke:var(--drift); stroke-width:1.8; fill:none; stroke-dasharray:5 4; }
  .thin{ stroke:var(--hairline); stroke-width:1.4; fill:none; }
  .step{ fill:var(--muted); font-size:11px; font-weight:700; letter-spacing:.1em; }
</style><marker id="af" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--verified)"/></marker><marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--drift)"/></marker><rect class="bg" width="960" height="564"/><text class="k" x="44" y="40" font-family="Conso, ui-monospace, Cascadia Mono, Consolas, monospace">A SHADER CANNOT ASK THE GAME A QUESTION, SO THE PLUGIN HAS TO ANSWER BEFORE IT IS ASKED</text><text class="h" x="44" y="72">How live game state reaches a shader parameter, or does not</text><path class="fwd" marker-end="url(#af)" d="M246.5 158H261.5"/><path class="fwd" marker-end="url(#af)" d="M471 158H486"/><path class="fwd" marker-end="url(#af)" d="M695.5 158H710.5"/><path class="fwd" marker-end="url(#af)" d="M920 158H940V276H20V350H37"/><path class="fwd" marker-end="url(#af)" d="M246.5 350H261.5"/><path class="fwd" marker-end="url(#af)" d="M471 350H486"/><path class="fwd" marker-end="url(#af)" d="M695.5 350H710.5"/><path class="back" marker-end="url(#ab)" d="M816.75 206V228H143.25V213"/><text class="k" x="480" y="245" text-anchor="middle" fill="var(--drift)">UNCHANGED BYTES ARE NEVER RESENT</text><path class="back" marker-end="url(#ab)" d="M592.25 398V420H143.25V405"/><text class="k" x="367.75" y="437" text-anchor="middle" fill="var(--drift)">A NAME ON ONE SIDE FAILS A TEST</text><g><rect class="card" x="44" y="110" width="198.5" height="96" rx="3"/><text class="step" x="58" y="101">01</text><text class="n" x="58" y="142">Frame tick</text><text class="s" x="58" y="168">The render hook, once a frame.</text></g><g><rect class="card" x="268.5" y="110" width="198.5" height="96" rx="3"/><text class="step" x="282.5" y="101">02</text><text class="n" x="282.5" y="142">Trackers</text><text class="s" x="282.5" y="168">Twenty-four domains collected.</text></g><g><rect class="card" x="493" y="110" width="198.5" height="96" rx="3"/><text class="step" x="507" y="101">03</text><text class="n" x="507" y="142">One struct</text><text class="s" x="507" y="168">133 float4 slots, flat.</text></g><g><rect class="card" x="717.5" y="110" width="198.5" height="96" rx="3"/><text class="step" x="731.5" y="101">04</text><text class="n" x="731.5" y="142">Dirty compare</text><text class="s" x="731.5" y="168">Sixteen bytes, or nothing</text><text class="s" x="731.5" y="183">goes.</text></g><g><rect class="card" x="44" y="302" width="198.5" height="96" rx="3"/><text class="step" x="58" y="293">05</text><text class="n" x="58" y="334">Name table</text><text class="s" x="58" y="360">A name and an offset per slot.</text></g><g><rect class="card" x="268.5" y="302" width="198.5" height="96" rx="3"/><text class="step" x="282.5" y="293">06</text><text class="n" x="282.5" y="334">ENB push</text><text class="s" x="282.5" y="360">Nine shaders, one call each.</text></g><g><rect class="card" x="493" y="302" width="198.5" height="96" rx="3"/><text class="step" x="507" y="293">07</text><text class="n" x="507" y="334">Shader header</text><text class="s" x="507" y="360">The same 133 names, declared.</text></g><g><rect class="card" x="717.5" y="302" width="198.5" height="96" rx="3"/><text class="step" x="731.5" y="293">08</text><text class="n" x="731.5" y="334">Shader read</text><text class="s" x="731.5" y="360">By name, or the effect goes</text><text class="s" x="731.5" y="375">without.</text></g><path class="thin" d="M816.75 398V448"/><path class="thin" d="M816.75 448H180.67V472"/><rect x="44" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--verified)" stroke-width="1.6"/><text class="n" x="58" y="493" font-size="13">PUBLISHED</text><text class="s" x="58" y="509" font-size="10.5">written to every target shader</text><path class="thin" d="M816.75 448H480V472"/><rect x="343.33" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--drift)" stroke-width="1.6"/><text class="n" x="357.33" y="493" font-size="13">SKIPPED</text><text class="s" x="357.33" y="509" font-size="10.5">the slot did not change</text><path class="thin" d="M816.75 448H779.33V472"/><rect x="642.67" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--muted)" stroke-width="1.6"/><text class="n" x="656.67" y="493" font-size="13">NO WRITE</text><text class="s" x="656.67" y="509" font-size="10.5">ENB was never resolved</text><text class="s" x="44" y="546">The published set is declared twice, once as a C++ table of names and offsets and once as annotated float4 declarations in the shader header. Both sides hold 133 names and the two sets are identical, and neither file can see the other, so a one-sided edit shows up as a failing test rather than as a parameter that silently reads zero.</text></svg>
