; =============================================================================
;  SkyrimBridge.ini — native ENB plugin replacement suite
;
;  SkyrimBridge reimplements the third-party ENB plugins its presets used to
;  depend on, using its OWN flat-INI configuration (no external loader, no
;  third-party config formats). Toggle each replacement here.
;
;    WeatherRouting        Per-worldspace ENB weatherlist switching. Reads
;                          enbseries\WeatherRouting.ini (auto-imported once
;                          from a legacy _worldspaceweatherlist.ini if found).
;
;    Sky                   Celestial lighting model (orbital sun/moon + dynamic
;                          ambient). Reads SkyrimBridge\Sky.ini. The model and
;                          config load here; the live ambient write is gated by
;                          [Sky] Enable inside Sky.ini (ships off — tune and
;                          validate in-game).
;
;    EnbLightInventoryFix  Stops ENB particle-lights on inventory-menu 3D item
;                          previews from leaking into the world. AE-only (the
;                          engine hooks are AE 1.6.x). Ships OFF: enable, then
;                          validate in-game before removing the third-party DLL.
;
;  The editor-ID cache (replacing the third-party NativeEditorID fix) is always
;  on — the weather workshop needs it to name forms.
; =============================================================================

[Native]
WeatherRouting       = true
Sky                  = true
EnbLightInventoryFix = false
EngineFixes          = true    ; recovered AE spin-lock patch (REL::ID 68233), validated before write
