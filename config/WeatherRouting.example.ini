; =============================================================================
;  WeatherRouting.example.ini — per-worldspace ENB weatherlist routing
;
;  Place this as  <game>\enbseries\WeatherRouting.ini  (next to _weatherlist.ini
;  and your weatherlist files). SkyrimBridge watches the player's worldspace and,
;  when it changes to a routed one, overwrites enbseries\_weatherlist.ini with
;  the mapped file and asks ENB to reload.
;
;  If this file is absent but a legacy _worldspaceweatherlist.ini exists, its
;  rules are imported here once — after that SkyrimBridge only reads this file.
;
;  Grammar (our scheme): one [Routes] section, one entry per route:
;      <Label> = <FormID>[, <FormID>...] : <weatherlist file in enbseries>
;  The label is freeform (it only appears in the log).
; =============================================================================

[Routes]
Tamriel    = 0x00003C            : Skyrim.ini
Solstheim  = 0x0300302A          : Solstheim.ini
Blackreach = 0x0001EE62          : Blackreach.ini
SoulCairn  = 0x0002F6C, 0x0002F6D : SoulCairn.ini

[Options]
; Empty = restore ENB's shipped _weatherlist.ini for unrouted worldspaces.
Default =
