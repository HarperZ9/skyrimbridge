; =============================================================================
;  GPU.ini — SkyrimBridge GPU tier
;
;  EnableGPUTier            Master switch for the D3D11 integration.
;  EnableAtmosphere         Physically-based sky LUTs (Rayleigh+Mie) and
;                           celestial rendering support textures.
;  EnableVolumetricClouds   Raymarched volumetric clouds. Shader compilation
;                           is heavy and runs in the background after data
;                           load; expect the pass to come online a little
;                           after the game world does.
;
;  Modes (auto-detected):
;    proxy   The SkyrimBridge d3d11 proxy is loaded (directly, or chained
;            through ENB's [PROXY] ProxyLibrary setting). Full mid-frame
;            injection with depth access.
;    legacy  No proxy (plain ENB). Present-time passes only; depth-aware
;            passes stay dormant.
;
;  Isolation hotkeys in game: F7 mid-frame dispatch, F8 compute+trackers,
;  F9 render passes, F10 frame capture (600 frames), F11 GPU profiler.
; =============================================================================

[GPU]
EnableGPUTier=true
EnableAtmosphere=true
EnableVolumetricClouds=false
