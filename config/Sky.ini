; =============================================================================
;  Sky.ini — SkyrimBridge celestial lighting model
;
;  A real astronomical model of the sun and moons (axial tilt + latitude +
;  solstice timing) plus moon-phase-weighted light sourcing and dynamic
;  directional ambient. This is SkyrimBridge's own configuration — flat
;  sections, no nested blocks, no external plugin format.
;
;  [Sky] Enable is the master switch for the LIVE per-frame writes. It ships
;  OFF: the orbital model and this config parse and validate offline, but the
;  dynamic ambient is a look you tune and confirm in-game. Turn it on when you
;  are ready to drive lighting from the model.
;
;  Per-form overrides use a section suffix, our scheme:
;    [Orbit:0x000A2C]   climate-specific orbital values
;    [Light:0x000A2C]   climate-specific light sourcing
;    [Weather:0x010C1F] weather-specific light sourcing
; =============================================================================

[Sky]
Enable = false            ; master switch for live per-frame writes

[Orbit]
Enable          = true
AdjustDayLength = true
MoveSun         = false   ; redirect the sun disc along the orbital incident
                          ; vector each frame (needs [Sky] Enable too; whether
                          ; the shadow follows the disc is validated in-game)
AxialTilt       = 23.4    ; degrees, -85..85
Latitude        = 35.0    ; degrees, -85..85
TwilightAngle   = 24.0    ; degrees below horizon where twilight ends
MasserTilt      = 2.0
SecundaTilt     = 18.0
SummerSolstice  = 173     ; day of year (0..365)
WinterSolstice  = 355.5

[Ambient]
Enable    = true
TiltScale = 0.8           ; 0..1, how strongly ambient tilts toward the source

[Light]
DaySource   = Sun         ; Sun | NightSky | Vanilla | Zenith | Custom
NightSource = NightSky
MinAngle    = 5.0         ; degrees above horizon for direct light

[Masser]
FullDirect     = 1.0
FullVolumetric = 1.0
NewDirect      = 0.1
NewVolumetric  = 0.7
Color          = 0.15, 0.04, 0.0, 1.0
FadeStart      = 20       ; degrees; fade the moon light out between these
FadeEnd        = 5

[Secunda]
FullDirect     = 0.5
FullVolumetric = 0.7
NewDirect      = 0.1
NewVolumetric  = 0.7
Color          = 0.15, 0.04, 0.0, 1.0
FadeStart      = 20
FadeEnd        = 5

[NightSky]
Direct           = 0.2
Volumetric       = 0.0
AuroraVolumetric = 0.5
Color            = 1, 1, 1, 0

[Tweaks]
SyncWeatherColors = true
